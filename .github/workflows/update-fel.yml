name: Update Dolby Vision FEL Lists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate FEL lists
        run: python generate_fel.py

      - name: Commit updated lists
        run: |
          git config user.name "FEL List Bot"
          git config user.email "actions@users.noreply.github.com"

          git add fel-all.json fel-latest.json

          git diff --cached --quiet || \
            git commit -m "Update Dolby Vision FEL lists"

          git push
